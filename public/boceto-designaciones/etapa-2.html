<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Boceto Director · Etapa 2</title><style>body{margin:0;background:#e9eef2;font:12px Arial;color:#27313a;min-width:1100px}.app{display:flex;min-height:100vh}aside{width:240px;background:#2d353c;color:#b7c1c8}.brand{background:white;color:#29353d;padding:21px;font-weight:bold}.brand b{background:#00acac;color:white;padding:7px;border-radius:4px;margin-right:8px}.profile{padding:22px;background:#20282e;color:white}.profile i{background:#348fe2;border-radius:50%;padding:10px;font-style:normal;margin-right:8px}.profile small{display:block;margin:8px 0;color:#b5c2ca}.nav{padding:15px 20px;border-left:3px solid #00acac;background:#20282e;color:white}.work{flex:1}.top{background:white;padding:18px 28px;border-bottom:1px solid #d5dde2}.top small{color:#00acac;font-weight:bold}.top h1{margin:6px 0 0;font-size:16px}main{padding:28px}.title{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.title h2{margin:7px 0 0;font-size:20px}.title a{color:#168aaf;cursor:pointer}.btn{border:1px solid #cbd5db;background:#fff;padding:8px 11px;font-weight:bold;font-size:11px;cursor:pointer}.primary{background:#348fe2;color:#fff;border-color:#348fe2}.warning{background:#f59c1a;color:#fff;border-color:#f59c1a}.panel,.card{background:#fff;border:1px solid #d6dfe4}.bar{padding:12px 16px;background:#242b31;color:white;font-weight:bold}.bar b{background:#00acac;font-size:9px;padding:4px 6px;margin-left:7px}.info{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:16px}.info div{padding:14px;border-right:1px solid #e2e8eb}.info small,label{display:block;color:#7c8993;font-size:9px;font-weight:bold}.info b{display:block;margin-top:5px}.notice{border-left:4px solid #f59c1a;background:#fff6e5;padding:12px;margin-bottom:15px}table{width:100%;border-collapse:collapse}th,td{padding:13px;border-bottom:1px solid #dce4e8;text-align:left}th{font-size:10px;text-transform:uppercase}tr:nth-child(even){background:#f3f5f7}select{padding:7px;border:1px solid #cbd5db;width:180px}.badge{padding:5px 8px;font-size:10px}.draft{background:#fff3d9;color:#9a6500}.sent{background:#dff4f4;color:#007d7d}.observed{background:#ffebe7;color:#be473a}.approved{background:#e5f7ed;color:#147341}.actions{margin:16px 0;text-align:right}.steps{display:flex;margin-bottom:16px}.steps span{flex:1;padding:13px;background:#fff;border:1px solid #d6dfe4;color:#7d8993}.steps span:first-child{border-bottom:3px solid #00acac;color:#27313a;font-weight:bold}.form{padding:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.history{display:grid;grid-template-columns:1fr 260px;gap:16px}.timeline{padding:18px}.timeline p{border-left:2px solid #dce4e8;padding-left:12px;color:#7d8993}.timeline b{display:block;color:#27313a}</style></head><body><div class="app"><aside><div class="brand"><b>U</b>UATF · Designaciones</div><div class="profile"><i>M</i><strong>Mgtr. María Quispe</strong><small>Directora · Ingeniería Informática</small></div><div class="nav">▤ Mis propuestas</div></aside><div class="work"><div class="top"><small>GESTIÓN ACADÉMICA · INF</small><h1>Propuestas de designación</h1></div><main id="main"></main></div></div><script>let page='editor',dirty=true;const $=s=>document.querySelector(s),B=(t,c='btn',p='')=>`<button class="${c}" data-p="${p}">${t}</button>`,H=(t,s)=>`<div class="title"><div><a data-p="list">← Mis propuestas</a><h2>${t}</h2><p>${s}</p></div></div>`;function editor(){return H('Propuesta de Designación Docente I/2026','Ingeniería Informática · Gestión 2026 · Primer período')+`<div class="notice">${dirty?'Tienes cambios sin guardar en esta propuesta.':'Borrador guardado correctamente.'}</div><div class="info card"><div><small>CARRERA</small><b>Ingeniería Informática (INF)</b></div><div><small>GESTIÓN / PERÍODO</small><b>2026 · Primer período</b></div><div><small>ESTADO</small><b><span class="badge draft">Borrador / Propuesta</span></b></div><div><small>ASIGNACIONES</small><b>42 grupos habilitados</b></div></div><section class="panel"><div class="bar">Asignación de docentes por grupo <b>EDITABLE</b></div><table><thead><tr><th>Materia</th><th>Grupo</th><th>Horas</th><th>Docente asignado</th><th>Estado</th></tr></thead><tbody><tr><td><b>INF-201 · Programación II</b></td><td>A</td><td>6 h</td><td><select><option>Lic. Juan Pérez</option></select></td><td><span class="badge draft">Pendiente</span></td></tr><tr><td><b>INF-302 · Bases de Datos</b></td><td>B</td><td>5 h</td><td><select><option>Ing. Paula Ramos</option></select></td><td><span class="badge draft">Pendiente</span></td></tr><tr><td><b>INF-401 · Ingeniería de Software</b></td><td>A</td><td>6 h</td><td><select><option>Sin asignar</option></select></td><td><span class="badge observed">Sin asignar</span></td></tr><tr><td><b>INF-105 · Matemática Discreta</b></td><td>A</td><td>4 h</td><td>Lic. Rosa Gómez</td><td><span class="badge approved">Aprobada previamente</span></td></tr></tbody></table></section><div class="actions">${B('Importar asignaciones','btn','import')} ${B('Historial','btn','history')} ${B('Guardar borrador','primary','save')} ${B('Enviar a revisión','warning','send')}</div>`}function imp(){return H('Importar asignaciones','Propuesta de Designación Docente I/2026')+`<div class="steps"><span>1. Seleccionar origen</span><span>2. Previsualizar cambios</span><span>3. Aplicar importación</span></div><section class="panel"><div class="bar">Origen de la información</div><div class="form"><label>Gestión de origen<select><option>Gestión 2025</option></select></label><label>Período de origen<select><option>Primer período</option></select></label><label>Destino<b>Gestión 2026 · Primer período</b></label></div><div class="actions">${B('Previsualizar cambios','primary','preview')}</div></section>`}function preview(){return H('Previsualización de importación','Revisa los cambios antes de aplicarlos')+`<section class="panel"><div class="bar">Cambios detectados <b>2 IMPORTABLES</b></div><table><thead><tr><th>Materia / Grupo</th><th>Actual</th><th>Importado</th><th>Impacto</th></tr></thead><tbody><tr><td>INF-201 · A</td><td>Juan Pérez</td><td>Juan Pérez</td><td><span class="badge draft">Sin cambios</span></td></tr><tr><td>INF-302 · B</td><td>—</td><td>Paula Ramos</td><td><span class="badge sent">Se asignará</span></td></tr><tr><td>INF-401 · A</td><td>—</td><td>Roberto Núñez</td><td><span class="badge observed">Requiere revisión</span></td></tr></tbody></table></section><div class="actions">${B('Aplicar importación','primary','apply')}</div>`}function hist(){return H('Historial de versiones','Propuesta de Designación Docente I/2026')+`<div class="history"><section class="panel"><div class="bar">Versiones enviadas</div><table><thead><tr><th>Versión</th><th>Enviada</th><th>Decisión</th><th></th></tr></thead><tbody><tr><td><b>Versión 3</b></td><td>28 jul. 2026 · 14:35</td><td><span class="badge sent">Pendiente</span></td><td>${B('Retirar envío','btn','editor')}</td></tr><tr><td><b>Versión 2</b></td><td>24 jul. 2026 · 10:12</td><td><span class="badge observed">Observada</span></td><td>${B('Ver observaciones')}</td></tr></tbody></table></section><aside class="card timeline"><b>Línea de tiempo</b><p><b>Versión 3 enviada</b>28 jul. · por María Quispe</p><p><b>Observaciones atendidas</b>27 jul. · borrador actualizado</p><p><b>Versión 2 observada</b>25 jul. · Vicerrectorado</p></aside></div>`}function render(){let f={editor,import:imp,preview,history:hist};$('#main').innerHTML=f[page]?f[page]():H('Mis propuestas','Regresa a la Etapa 1 para la lista');}document.addEventListener('click',e=>{let b=e.target.closest('[data-p]');if(!b)return;let p=b.dataset.p;if(p==='save'){dirty=false;p='editor'}if(p==='send'){alert('Versión enviada a Vicerrectorado (simulación).');p='history'}if(p==='apply'){dirty=true;p='editor'}page=p;render()});render();</script></body></html>
